<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">

<title>For You — A Jar for Every Feeling 🤍</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:Georgia,serif;

    color:#403846; display:flex; justify-content:center; padding:24px 14px;
  }
  .app{width:min(900px,100%); text-align:center}
  h1{font-size:clamp(28px,7vw,48px); margin:10px 0 6px}
  .subtitle{font-family:Arial,sans-serif;color:#756b78;margin:0 auto 20px;line-height:1.6}
  .jar-wrap{position:relative;margin:18px auto 26px;width:230px;height:260px}
  .lid{position:absolute;top:10px;left:35px;width:160px;height:24px;border-radius:8px;background:#d8c1cf;box-shadow:0 5px 0 #b99dac}
  .jar{
    position:absolute;top:28px;left:22px;width:186px;height:215px;
    border:5px solid rgba(255,255,255,.9); border-radius:38px 38px 48px 48px;
    background:rgba(255,255,255,.35); box-shadow:inset 0 0 25px rgba(255,255,255,.7),0 15px 35px rgba(90,70,100,.12);
    overflow:hidden; backdrop-filter:blur(5px);
  }
  .paper{position:absolute;width:32px;height:22px;border-radius:4px;box-shadow:0 3px 5px #0001;animation:float 3s ease-in-out infinite}
  .p1{background:#ffe89a;left:28px;bottom:28px;transform:rotate(-15deg)}
  .p2{background:#bfe8c4;left:68px;bottom:18px;transform:rotate(12deg);animation-delay:.4s}
  .p3{background:#ffb6bd;left:112px;bottom:31px;transform:rotate(-8deg);animation-delay:.8s}
  .p4{background:#b9d8ff;left:140px;bottom:19px;transform:rotate(18deg);animation-delay:1.2s}
  .p5{background:#d8c1ff;left:48px;bottom:58px;transform:rotate(20deg);animation-delay:1.6s}
  .p6{background:#ffcf9e;left:93px;bottom:66px;transform:rotate(-20deg);animation-delay:2s}
  @keyframes float{50%{translate:0 -5px}}
  .feelings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 20px;max-width:720px}
  button{border:0;border-radius:16px;padding:14px 10px;font:600 15px Arial,sans-serif;cursor:pointer;transition:.2s;box-shadow:0 5px 15px #00000012}
  button:hover{transform:translateY(-2px)}
  .happy{background:#ffe68a}.thankful{background:#bfe8c4}.angry{background:#ff9fa8}.anxious{background:#afd3ff}.lonely{background:#cdb5ff}.sad{background:#ffb8d0}
  .card{
    display:none;background:#fff;max-width:720px;margin:18px auto;padding:26px;border-radius:24px;
    box-shadow:0 12px 40px #5d4b6518;text-align:left;animation:pop .3s ease
  }
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  .emotion{font:700 14px Arial,sans-serif;text-transform:uppercase;letter-spacing:1.5px}
  .verse{font-size:22px;line-height:1.65;margin:16px 0}
  .ref{font:bold 15px Arial,sans-serif;color:#786b78}
  .remember{border-left:4px solid #d9a8bd;padding:10px 14px;margin-top:16px;font:15px/1.6 Arial,sans-serif;background:#fff8fb;border-radius:0 10px 10px 0}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .secondary{background:#f0ebf0;color:#544b55}
  .footer{font:13px Arial,sans-serif;color:#887d88;margin:22px 0}
  @media(max-width:600px){.feelings{grid-template-columns:repeat(2,1fr)}.verse{font-size:19px}.card{padding:20px}}
</style>
</head>

  </div>  <div id="card" class="card">

    <div id="verse" class="verse"></div>
    <div id="ref" class="ref"></div>
    <div id="remember" class="remember"></div><div class="actions">
  <button class="secondary" onclick="pick(currentEmotion)">💌 Pick another</button>
  <button class="secondary" onclick="closeCard()">Close</button>
</div>

const names = {
  happy:"💛 HAPPY",
  thankful:"💚 THANKFUL",
  angry:"❤️ ANGRY",
  anxious:"💙 ANXIOUS",
  lonely:"💜 LONELY",
  sad:"🩷 SAD"
};

let currentEmotion = "happy";

function pick(emotion){
  currentEmotion = emotion;

  const list = data[emotion];
  const item = list[Math.floor(Math.random() * list.length)];

  document.getElementById("emotion").textContent = names[emotion];
  document.getElementById("verse").textContent = "“" + item[1] + "”";
  document.getElementById("ref").textContent = item[0];
  document.getElementById("remember").innerHTML =
    "<b>Remember:</b> " + item[2];

  document.getElementById("card").style.display = "block";
  document.getElementById("card").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
}

function closeCard(){
  document.getElementById("card").style.display = "none";
}
